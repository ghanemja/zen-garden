<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zen Garden</title>
  <meta name="description" content="Build your own little 3D zen garden: drag in stones, plants and animals, rake the sand, and relax to gentle sounds.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d9b77f'/%3E%3Crect x='3' y='3' width='26' height='26' rx='2' fill='%23efe4cf'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c9b48e' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23c9b48e' stroke-width='1.6'/%3E%3Cellipse cx='16' cy='16' rx='3' ry='2.2' fill='%23333'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="6" fill="#d9b77f"/><rect x="5" y="5" width="30" height="30" rx="2" fill="#f1e7d3"/><circle cx="20" cy="20" r="11" fill="none" stroke="#cdb894" stroke-width="1.5"/><circle cx="20" cy="20" r="6.5" fill="none" stroke="#cdb894" stroke-width="1.5"/><ellipse cx="20" cy="20" rx="3.6" ry="2.6" fill="#34363a"/></svg>
        <div>
          <h1>Zen Garden</h1>
          <p>place · rake · breathe</p>
        </div>
      </div>

      <nav class="tools" role="toolbar" aria-label="Sand tools">
        <button class="tool" data-tool="rake" title="Rake (1)"><svg viewBox="0 0 24 24"><path d="M12 2v7M5 9h14M6 9v6M9.5 9v6M12 9v6M14.5 9v6M18 9v6"/></svg><span>Rake</span></button>
        <button class="tool" data-tool="wide" title="Wide rake (2)"><svg viewBox="0 0 24 24"><path d="M12 2v6M2 8h20M3 8v7M6 8v7M9 8v7M12 8v7M15 8v7M18 8v7M21 8v7"/></svg><span>Wide rake</span></button>
        <button class="tool" data-tool="stick" title="Stick (3)"><svg viewBox="0 0 24 24"><path d="M5 19C9 13 13 15 19 5"/></svg><span>Stick</span></button>
        <button class="tool" data-tool="ripple" title="Ripples: tap the sand or a stone (4)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9.5"/></svg><span>Ripples</span></button>
        <button class="tool" data-tool="smooth" title="Smooth the sand (5)"><svg viewBox="0 0 24 24"><path d="M3 15c3-3 6 3 9 0s6 3 9 0"/><path d="M6 10h12" opacity=".5"/></svg><span>Smooth</span></button>
        <button class="tool" data-tool="pour" title="Pour sand to build piles, or spill it over the edge (6)"><svg viewBox="0 0 24 24"><path d="M4 6l7-2 2 7-7 2z"/><path d="M12 12c1 3 1 5 1 8M15 14v2M10 17v1M16 19v1"/></svg><span>Pour</span></button>
      </nav>

      <div class="sound" aria-label="Sound">
        <button class="chip" data-amb="wind" aria-pressed="false" title="Gentle wind">Wind</button>
        <button class="chip" data-amb="chimes" aria-pressed="false" title="Wind chimes">Chimes</button>
        <button class="chip" data-amb="stream" aria-pressed="false" title="Babbling stream">Stream</button>
        <button class="icon-btn" id="mute" aria-pressed="false" title="Mute">
          <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
      </div>
    </header>

    <aside class="palette" id="palette" aria-label="Things to place">
      <p class="pal-hint">Drag into the sand, or tap to add</p>
    </aside>

    <main class="stage" id="stage">
      <!-- the 3D view canvas is inserted here -->
      <div class="loading" id="loading">Setting up your garden…</div>

      <div class="viewbtns" role="group" aria-label="Camera">
        <button data-view="3d" aria-pressed="true" title="Angled 3D view (T)">3D</button>
        <button data-view="top" aria-pressed="false" title="Look straight down (T)">Top</button>
      </div>
      <p class="orbit-tip">Right-drag or two fingers to turn · scroll to zoom</p>

      <button class="sound-note" id="soundNote" hidden>🔈 Click anywhere to turn on sound</button>

      <div class="objbar" id="objbar" hidden>
        <button data-act="rotl" title="Rotate left (Shift+R)" aria-label="Rotate left">↺</button>
        <button data-act="rotr" title="Rotate right (R)" aria-label="Rotate right">↻</button>
        <button data-act="smaller" title="Smaller (−)" aria-label="Smaller">−</button>
        <button data-act="bigger" title="Bigger (+)" aria-label="Bigger">+</button>
        <button data-act="flip" title="Flip (F)" aria-label="Flip">⇋</button>
        <button data-act="delete" class="danger" title="Remove (Delete), or drag it out of the tray" aria-label="Remove">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Drag things in from the left · rake the sand · tap the animals</div>

      <div class="controls">
        <div class="group"><span class="lbl">Sand</span><div class="swatches" id="sandSwatches"></div></div>
        <div class="group"><span class="lbl">Frame</span><div class="swatches" id="frameSwatches"></div></div>
        <div class="group actions">
          <label class="switch"><input type="checkbox" id="roam" checked><span class="track"></span>Animals roam</label>
          <button class="btn" id="undo" title="Undo last stroke (Ctrl+Z)">Undo</button>
          <button class="btn" id="clear" title="Smooth all the sand">Smooth all</button>
          <button class="btn" id="save" title="Download a picture of your garden">Save picture</button>
          <button class="btn subtle" id="reset" title="Start an empty garden">New garden</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/items.js"></script>
  <script src="js/sand.js"></script>
  <script src="js/audio.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    // If the 3D view can't start (very old browser or WebGL turned off), say so.
    setTimeout(function () {
      if (!document.body.classList.contains('ready')) {
        var l = document.getElementById('loading');
        if (l) l.textContent = 'Your browser couldn’t start the 3D view. Try an up-to-date Chrome, Edge, Firefox or Safari.';
      }
    }, 8000);
  </script>
</body>
</html>
